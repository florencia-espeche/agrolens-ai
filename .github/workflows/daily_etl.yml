name: AgroLens AI - Daily ETL & Alerts

on:
  schedule:
    # Se ejecuta todos los días a las 09:00 UTC (06:00 AM hora de Argentina)
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  run-pipelines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar ETL (NASA POWER + Sentinel-2 últimos 7 días)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEE_PROJECT_ID: ${{ secrets.GEE_PROJECT_ID }}
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
        run: python pipelines/etl_ingesta_agro.py --days 7

      - name: Ejecutar Detector de Alertas IA (Isolation Forest + Gemini)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pipelines/ia_detector_alertas.py